<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-label="The Denim Forge bulk wholesale">
  <defs>
    <linearGradient id="bg3" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101826"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="jean3" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3a5f92"/>
      <stop offset="0.55" stop-color="#244870"/>
      <stop offset="1" stop-color="#163050"/>
    </linearGradient>
    <linearGradient id="jean3b" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2d4f7a"/>
      <stop offset="1" stop-color="#152848"/>
    </linearGradient>
    <pattern id="floor3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40H40M40 0V40" stroke="#fff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg3)"/>
  <rect width="1600" height="900" fill="url(#floor3)"/>
  <ellipse cx="800" cy="860" rx="700" ry="120" fill="#000" opacity="0.45"/>

  <!-- Diagonal bulk jeans flat-lay (unbranded shapes) -->
  <g transform="translate(700,80)">
    <g transform="rotate(18 300 360)">
      <rect x="80" y="60" width="280" height="620" rx="36" fill="url(#jean3)"/>
      <path d="M140 140 C200 110, 240 110, 300 140" stroke="#f87171" stroke-width="2.5" stroke-dasharray="4 6" fill="none" opacity="0.75"/>
      <circle cx="130" cy="180" r="6" fill="#c9a227"/>
      <circle cx="310" cy="180" r="6" fill="#c9a227"/>
    </g>
    <g transform="rotate(-12 420 400)">
      <rect x="260" y="40" width="280" height="620" rx="36" fill="url(#jean3b)"/>
      <path d="M320 130 C380 100, 420 100, 480 130" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
      <rect x="350" y="280" width="100" height="64" rx="6" fill="#0a1220" opacity="0.35"/>
    </g>
    <g transform="rotate(32 180 500)">
      <rect x="-40" y="220" width="260" height="560" rx="32" fill="#1c3a5e" opacity="0.9"/>
    </g>
  </g>

  <!-- Own brand only -->
  <g transform="translate(120,560)">
    <rect width="420" height="3" fill="#c41e3a"/>
    <text x="0" y="48" font-family="Archivo, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">The Denim Forge</text>
    <text x="0" y="82" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="3">BULK WHOLESALE · PAN INDIA</text>
  </g>
</svg>
