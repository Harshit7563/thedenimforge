<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-label="The Denim Forge wholesale denim">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1220"/>
      <stop offset="0.45" stop-color="#152238"/>
      <stop offset="1" stop-color="#1a2a44"/>
    </linearGradient>
    <linearGradient id="indigo1" x1="900" y1="80" x2="1500" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a4a78"/>
      <stop offset="0.5" stop-color="#1a3558"/>
      <stop offset="1" stop-color="#0f2238"/>
    </linearGradient>
    <linearGradient id="forge1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c41e3a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c41e3a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="weave1" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
      <path d="M0 0L12 12" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="soft1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg1)"/>
  <rect width="1600" height="900" fill="url(#weave1)"/>
  <ellipse cx="1280" cy="200" rx="420" ry="280" fill="url(#forge1)"/>
  <ellipse cx="200" cy="720" rx="360" ry="220" fill="#2a3d55" opacity="0.35"/>

  <!-- Stacked jeans silhouettes (unbranded) -->
  <g filter="url(#soft1)" transform="translate(920,140)">
    <rect x="40" y="40" width="420" height="560" rx="28" fill="url(#indigo1)" transform="rotate(-8 250 320)"/>
    <rect x="70" y="70" width="420" height="560" rx="28" fill="#243f66" transform="rotate(-3 280 350)"/>
    <rect x="100" y="90" width="420" height="560" rx="28" fill="#1e375c"/>
    <path d="M180 180 C260 150, 360 150, 440 180" stroke="#f87171" stroke-width="3" stroke-dasharray="6 8" fill="none" opacity="0.7"/>
    <circle cx="160" cy="220" r="7" fill="#c9a227"/>
    <circle cx="460" cy="220" r="7" fill="#c9a227"/>
    <rect x="250" y="300" width="120" height="70" rx="6" fill="#0f1724" opacity="0.35"/>
  </g>

  <!-- Brand mark only -->
  <g transform="translate(120,620)">
    <circle cx="36" cy="36" r="34" fill="#1e3a5f"/>
    <circle cx="36" cy="36" r="34" stroke="#fff" stroke-opacity="0.15"/>
    <path d="M18 30 C28 20, 44 20, 54 30" stroke="#f87171" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
    <text x="86" y="32" font-family="Archivo, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">The Denim Forge</text>
    <text x="86" y="58" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.45" letter-spacing="4">WHOLESALE JEANS</text>
  </g>
</svg>
