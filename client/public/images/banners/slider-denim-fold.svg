<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-label="The Denim Forge premium denim">
  <defs>
    <linearGradient id="bg2" x1="0" y1="900" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080e18"/>
      <stop offset="0.55" stop-color="#121c2c"/>
      <stop offset="1" stop-color="#1a2740"/>
    </linearGradient>
    <linearGradient id="fold2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#355a8a"/>
      <stop offset="0.4" stop-color="#1f3d66"/>
      <stop offset="1" stop-color="#132742"/>
    </linearGradient>
    <linearGradient id="shine2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="weave2" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="transparent"/>
      <path d="M0 8H16M8 0V16" stroke="#fff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect width="1600" height="900" fill="url(#weave2)"/>
  <ellipse cx="1100" cy="450" rx="560" ry="380" fill="#c41e3a" opacity="0.08"/>

  <!-- Folded denim panels -->
  <g transform="translate(780,120)">
    <path d="M40 80 L620 40 L680 720 L80 780 Z" fill="url(#fold2)"/>
    <path d="M40 80 L620 40 L680 720 L80 780 Z" fill="url(#shine2)"/>
    <path d="M120 200 L560 160" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M110 320 L540 280" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round"/>
    <path d="M100 460 L520 430" stroke="#f87171" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="5 7"/>
    <rect x="280" y="360" width="140" height="90" rx="8" fill="#0a1220" opacity="0.4"/>
    <circle cx="160" cy="250" r="8" fill="#c9a227"/>
    <circle cx="520" cy="220" r="8" fill="#c9a227"/>
  </g>

  <g transform="translate(120,620)">
    <text x="0" y="28" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">The Denim Forge</text>
    <text x="0" y="58" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="600" fill="#c41e3a" letter-spacing="3.5">FACTORY DIRECT · EST. INDIA</text>
  </g>
</svg>
