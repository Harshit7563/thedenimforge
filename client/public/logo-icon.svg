<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="denim-bg" x1="20" y1="15" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b4c7e"/>
      <stop offset="0.45" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f1f35"/>
    </linearGradient>
    <linearGradient id="denim-shine" x1="60" y1="8" x2="60" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rivet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#f0d060"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8b6914"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer badge -->
  <circle cx="60" cy="60" r="54" fill="url(#denim-bg)" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="54" fill="url(#denim-shine)"/>

  <!-- Inner ring -->
  <circle cx="60" cy="60" r="47.5" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Denim stitch -->
  <path
    d="M27 46 C40 31, 80 31, 93 46"
    stroke="#f87171"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="3.5 5.5"
    fill="none"
    opacity="0.95"
  />

  <!-- DF monogram — shared vertical stem -->
  <g fill="#ffffff">
    <!-- D bowl + shared stem -->
    <path d="M38 33.5 H51.5 C64.8 33.5 74.5 43.5 74.5 56.5 C74.5 69.5 64.8 79.5 51.5 79.5 H38 Z M46.5 41.5 V71.5 H51 C59.5 71.5 66 65 66 56.5 C66 48 59.5 41.5 51 41.5 Z"/>
    <!-- F bars on shared stem -->
    <path d="M57 33.5 H84.5 V42 H66.5 V51 H81 V59.5 H66.5 V79.5 H57 Z"/>
  </g>

  <!-- Rivets -->
  <circle cx="31" cy="81" r="4.2" fill="url(#rivet)"/>
  <circle cx="31" cy="81" r="1.6" fill="#fff8dc" opacity="0.6"/>
  <circle cx="89" cy="81" r="4.2" fill="url(#rivet)"/>
  <circle cx="89" cy="81" r="1.6" fill="#fff8dc" opacity="0.6"/>
</svg>
