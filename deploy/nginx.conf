# Nginx config for thedenimforge.com
# Copy to: /etc/nginx/sites-available/thedenimforge.com

server {
    listen 80;
    server_name thedenimforge.com www.thedenimforge.com;
    return 301 https://thedenimforge.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thedenimforge.com www.thedenimforge.com;

    ssl_certificate /etc/letsencrypt/live/thedenimforge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thedenimforge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/thedenimforge/client/dist;
    index index.html;

    # React SPA — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        client_max_body_size 20M;
    }

    # Uploaded product images
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|svg|webp|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
